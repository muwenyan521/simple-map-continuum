// Ports exposed to loader adapters. No Minecraft or loader classes belong here.

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.0'
}

tasks.withType(Test).configureEach {
    if (delegate.hasProperty('failOnNoDiscoveredTests')) {
        delegate.setProperty('failOnNoDiscoveredTests', false)
    }
}

tasks.register('runtimeCompositionSelfTest', JavaExec) {
    dependsOn(tasks.named('testClasses'))
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.muwenyan.simplemap.platform.MapRuntimeTest'
}

tasks.register('runtimeRefreshSelfTest', JavaExec) {
    dependsOn(tasks.named('testClasses'))
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.muwenyan.simplemap.platform.MapRuntimeRefreshTest'
}

tasks.named('check') {
    dependsOn(tasks.named('runtimeCompositionSelfTest'), tasks.named('runtimeRefreshSelfTest'))
}
