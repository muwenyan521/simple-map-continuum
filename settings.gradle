pluginManagement {
    repositories {
        maven { url = uri('https://maven.fabricmc.net/') }
        maven { url = uri('https://maven.minecraftforge.net/') }
        maven { url = uri('https://maven.neoforged.net/releases/') }
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        mavenCentral()
        maven { url = uri('https://maven.fabricmc.net/') }
        maven { url = uri('https://maven.minecraftforge.net/') }
        maven { url = uri('https://maven.neoforged.net/releases/') }
    }
}

rootProject.name = 'simple-map-continuum'

include(':core')
include(':platform-api')
include(':fabric-1.20.1')
include(':fabric-1.21.1')
include(':forge-1.20.1')
include(':neoforge-1.21.1')

project(':platform-api').projectDir = file('platform-api')
project(':fabric-1.20.1').projectDir = file('platform/fabric-1.20.1')
project(':fabric-1.21.1').projectDir = file('platform/fabric-1.21.1')
project(':forge-1.20.1').projectDir = file('platform/forge-1.20.1')
project(':neoforge-1.21.1').projectDir = file('platform/neoforge-1.21.1')
