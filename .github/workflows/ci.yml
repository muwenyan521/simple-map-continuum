name: CI

on:
  push:
  pull_request:

jobs:
  matrix:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [core, platform-api, fabric-1.20.1, fabric-1.21.1, forge-1.20.1, neoforge-1.21.1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :${{ matrix.target }}:check --no-daemon

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew matrixCheck dependencyIsolationCheck --no-daemon
