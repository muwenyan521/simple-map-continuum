plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17-SNAPSHOT'
}

loom {
    mods {
        simplemap {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.19.5'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.17+1.21.1'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

tasks.register('targetSelfTest', JavaExec) {
    dependsOn(tasks.named('testClasses'))
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.muwenyan.simplemap.fabric.Fabric1211TargetTest'
}
tasks.named('check') { dependsOn(tasks.named('targetSelfTest')) }
