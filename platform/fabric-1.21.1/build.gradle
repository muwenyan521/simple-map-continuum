dependencies {
    compileOnly 'net.fabricmc:fabric-loader:0.16.5'
    compileOnly 'net.fabricmc.fabric-api:fabric-api:0.102.0+1.21.1'
}

tasks.register('targetSelfTest', JavaExec) {
    dependsOn(tasks.named('testClasses'))
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.muwenyan.simplemap.fabric.Fabric1211TargetTest'
}
tasks.named('check') { dependsOn(tasks.named('targetSelfTest')) }
