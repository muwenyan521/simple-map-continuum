plugins {
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

group = 'com.muwenyan.simplemap'
version = rootProject.ext.projectVersion

base {
    archivesName = 'neoforge-1.21.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

dependencies {
    implementation 'net.neoforged:neoforge:21.1.235'
}

tasks.withType(ProcessResources).configureEach {
    inputs.property('version', project.version)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(version: project.version)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.remove('-Werror')
    options.compilerArgs.add('-Xlint:none')
}

tasks.register('targetSelfTest', JavaExec) {
    dependsOn(tasks.named('testClasses'))
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.muwenyan.simplemap.neoforge.NeoForge1211TargetTest'
}
tasks.named('check') { dependsOn(tasks.named('targetSelfTest')) }
