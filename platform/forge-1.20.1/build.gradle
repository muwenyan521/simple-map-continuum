dependencies {
    compileOnly 'net.minecraftforge:javafmllanguage:1.20.1-47.3.0'
}

tasks.register('targetSelfTest', JavaExec) {
    dependsOn(tasks.named('testClasses'))
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.muwenyan.simplemap.forge.Forge1201TargetTest'
}
tasks.named('check') { dependsOn(tasks.named('targetSelfTest')) }
