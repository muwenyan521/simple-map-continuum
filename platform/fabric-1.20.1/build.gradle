plugins {
    id 'fabric-loom' version '1.9.2'
}

loom {
    mods {
        simplemap {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.19.5'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.12+1.20.1'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

tasks.register('targetSelfTest', JavaExec) {
    dependsOn(tasks.named('testClasses'))
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.muwenyan.simplemap.fabric.Fabric1201TargetTest'
}
tasks.named('check') { dependsOn(tasks.named('targetSelfTest')) }
