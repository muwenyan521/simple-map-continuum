dependencies {
    compileOnly 'net.fabricmc:fabric-loader:0.15.11'
}

tasks.register('targetSelfTest', JavaExec) {
    dependsOn(tasks.named('testClasses'))
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.muwenyan.simplemap.fabric.Fabric1201TargetTest'
}
tasks.named('check') { dependsOn(tasks.named('targetSelfTest')) }
