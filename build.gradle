plugins {
    id 'base'
}

ext {
    projectVersion = '0.1.0-SNAPSHOT'
    javaReleaseByTarget = [
        'fabric-1.20.1': 17,
        'forge-1.20.1': 17,
        'fabric-1.21.1': 21,
        'neoforge-1.21.1': 21,
    ]
}

allprojects {
    group = 'com.muwenyan.simplemap'
    version = rootProject.ext.projectVersion
}

subprojects {
    apply plugin: 'java-library'

    java {
        toolchain {
            // Core and ports target the oldest supported runtime so every loader
            // family can consume them; platform targets retain their own baseline.
            languageVersion = JavaLanguageVersion.of(
                project == rootProject ? 21 :
                    (name in ['core', 'platform-api'] ? 17 : (rootProject.ext.javaReleaseByTarget[name] ?: 21))
            )
        }
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        if (delegate.hasProperty('failOnNoDiscoveredTests')) {
            delegate.setProperty('failOnNoDiscoveredTests', false)
        }
    }
}

project(':core') {
    description = 'Loader- and Minecraft-independent map domain and algorithms'
}

project(':platform-api') {
    description = 'Project-owned ports and platform contracts'
    dependencies {
        api project(':core')
    }
}

configure([project(':fabric-1.20.1'), project(':fabric-1.21.1'), project(':forge-1.20.1'), project(':neoforge-1.21.1')]) {
    description = 'Explicit loader/version adapter target'
    dependencies {
        implementation project(':platform-api')
        testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.0'
    }
    tasks.register('targetJarCheck') {
        dependsOn(tasks.named('jar'))
        doLast {
            def archive = tasks.named('jar').get().archiveFile.get().asFile
            def entries = zipTree(archive).files.collect { it.path - (archive.parentFile.path + File.separator) }
            if (!entries.any { it.endsWith('PlatformBootstrap') || it.endsWith('PlatformBootstrap.class') }) {
                throw new GradleException("target jar missing compiled classes: ${project.name}")
            }
            if (archive.length() == 0) {
                throw new GradleException("target jar is empty: ${project.name}")
            }
        }
    }
    tasks.named('check') { dependsOn(tasks.named('targetJarCheck')) }
}

tasks.register('dependencyIsolationCheck') {
    group = 'verification'
    description = 'Ensures core has no external or loader runtime dependencies.'
    dependsOn(':core:dependencies', ':platform-api:dependencies')
    doLast {
        def forbidden = subprojects.findAll { it.name == 'core' }.collectMany { p ->
            // Test fixtures may use JUnit; only the published main runtime must
            // remain JDK-only.
            p.configurations.findAll { cfg ->
                cfg.name in ['compileClasspath', 'runtimeClasspath'] && cfg.canBeResolved
            }.collectMany { cfg ->
                cfg.incoming.resolutionResult.allDependencies.collect { it.requested.displayName }
            }
        }
        if (!forbidden.isEmpty()) {
            throw new GradleException("core must remain dependency-free; found: ${forbidden}")
        }
    }
}

tasks.register('matrixCheck') {
    group = 'verification'
    description = 'Compiles every declared loader/version target.'
    dependsOn(subprojects.collect { it.tasks.named('check') })
}

tasks.register('architectureBoundaryCheck') {
    group = 'verification'
    description = 'Checks loader isolation and target metadata presence.'
    doLast {
        def forbidden = ['net.minecraft.', 'net.fabricmc.', 'net.minecraftforge.', 'net.neoforged.',
                         'com.mojang.blaze3d.', 'org.lwjgl.']
        def leaked = fileTree('core/src/main/java').matching { include '**/*.java' }.findAll { file ->
            def source = file.getText('UTF-8')
            forbidden.any { source.contains(it) }
        }
        if (!leaked.isEmpty()) {
            throw new GradleException("core loader boundary violation: ${leaked}")
        }
        def metadata = [
            'platform/fabric-1.20.1/src/main/resources/fabric.mod.json',
            'platform/fabric-1.21.1/src/main/resources/fabric.mod.json',
            'platform/forge-1.20.1/src/main/resources/META-INF/mods.toml',
            'platform/neoforge-1.21.1/src/main/resources/META-INF/neoforge.mods.toml'
        ]
        def missing = metadata.findAll { !file(it).isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException("missing target metadata: ${missing}")
        }
    }
}

tasks.named('matrixCheck') {
    dependsOn(tasks.named('architectureBoundaryCheck'))
}
